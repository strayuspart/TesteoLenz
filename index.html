  if(k==='('){const a=E();if(nx()!==')')throw 0;return a}
  if(F[k]){if(nx()!=='(')throw 0;const a=E();if(nx()!==')')throw 0;const f=F[k];return (x,y)=>f(a(x,y))}throw 0}
