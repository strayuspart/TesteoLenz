function seg(el,s){
  const mt=[];s=s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/g,m=>{mt.push(m);return '@@M'+(mt.length-1)+'@@'});
  let h=DOMPurify.sanitize(marked.parse(s,{breaks:true}));
  h=h.replace(/@@M(\d+)@@/g,(_,i)=>esc(mt[i]));
  const d=document.createElement('div');d.innerHTML=h;el.appendChild(d);
  try{renderMathInElement(d,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}catch(e){}
}
function show(el,text,live){
  el.dataset.raw=text;el.textContent='';const re=/```(plot|svg)[^\n]*\n([\s\S]*?)```/g;let last=0,m;
  while((m=re.exec(text))){seg(el,text.slice(last,m.index));
    let n=null;if(m[1]==='plot')n=plot(m[2]);else{const c=DOMPurify.sanitize(m[2],{USE_PROFILES:{svg:true,svgFilters:true}});const t=document.createElement('div');t.innerHTML=c;n=t.firstElementChild}
    if(n){const f=document.createElement('div');f.className='fig';f.appendChild(n);el.appendChild(f)}last=re.lastIndex}
  let rest=text.slice(last);const o=rest.indexOf('```');if(o>=0)rest=rest.slice(0,o)+'\n\n*Dibujando…*';
  seg(el,rest);if(live)el.classList.add('cur');else el.classList.remove('cur');
}
const near=()=>log.scrollHeight-log.scrollTop-log.clientHeight<140;
const COPY='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"/></svg>';
function add(t,c,live){const d=document.createElement('div');d.className='m '+c;
  if(c==='u'){d.textContent=t;W.appendChild(d)}else{show(d,t,live);const w=document.createElement('div');w.className='mw';const k=document.createElement('button');k.type='button';k.className='cp';k.setAttribute('aria-label','Copiar respuesta');k.innerHTML=COPY;
    k.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(d.dataset.raw||'');k.classList.add('ok');setTimeout(()=>k.classList.remove('ok'),1200)};w.append(d,k);W.appendChild(w)}
  log.scrollTop=log.scrollHeight;return d}
function hero(){
  W.innerHTML='<div class="hero"><div class="orb"></div><h2>¿Qué parte de la física aplicada se te atascó?</h2><div class="hsec"><span>Modos de estudio</span><button id="hl">Ver laboratorio</button></div><div class="cards4" id="c4"></div></div>';
  const IC=d=>'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
  [['Explicar un concepto','De la intuición a la fórmula.','<path d="M10 3a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9zM8 17h4"/>','explicar'],
   ['Resolver un problema','Paso a paso, con unidades.','<rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7h6M7 11h2M11 11h2M7 14h2M11 14h2"/>','resolver'],
   ['Practicar','Un ejercicio y te corrijo.','<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.5"/>','practicar'],
   ['Repaso rápido','Fórmulas y errores comunes.','<path d="M5 3h8l3 3v11H5zM8 9h5M8 12h5"/>','repaso']].forEach(([t,d,p,m])=>{
    const b=document.createElement('button');b.innerHTML='<i>'+IC(p)+'</i><span><b>'+t+'</b><small>'+d+'</small></span>';if(m===mode)b.classList.add('sel');
    b.onclick=()=>{document.querySelector('#modes [data-m="'+m+'"]').click();document.querySelectorAll('#c4 button').forEach(x=>x.classList.toggle('sel',x===b));$('q').focus()};$('c4').appendChild(b)});
  $('hl').onclick=()=>setView('lab');
}
function render(){W.innerHTML='';if(!chat.length)return hero();chat.forEach((m,i)=>{const d=add(m.content,m.role==='user'?'u':'b');if(m.role!=='user')simChips(d.parentNode,(chat[i-1]?chat[i-1].content:'')+' '+m.content)})}
async function toB64(file){
  const bmp=await createImageBitmap(file),s=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}
$('clip').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pic={type:'image/jpeg',data:await toB64(f)};$('pic').innerHTML='Imagen adjunta: '+esc(f.name)+' <a id="rm">quitar</a>';$('rm').onclick=()=>{pic=null;$('pic').textContent='';$('file').value=''}}catch(x){pic=null}};
async function ask(text){
  text=(text||'').trim();if(busy||(!text&&!pic))return;if(!text)text='Resuelve el problema de la imagen.';
  busy=true;if(!chat.length)W.innerHTML='';
  add(text+(pic?'  [imagen adjunta]':''),'u');const out=add('','b',true);
  const img=pic;pic=null;$('pic').textContent='';$('file').value='';
  const msgs=chat.map(m=>({role:m.role,content:m.content})).concat([{role:'user',content:text,image:img||undefined}]);
  let acc='',raf=0;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-code':localStorage.getItem('lenz.code')||''},body:JSON.stringify({messages:msgs,mode,topic})});
    if(r.status===401){const c=prompt('Código de acceso:');if(c)localStorage.setItem('lenz.code',c);throw new Error('Escribe de nuevo tu pregunta con el código.')}
    if(!r.ok){let m='No pude responder.';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
    const rd=r.body.getReader(),dc=new TextDecoder();
    for(;;){const{done,value}=await rd.read();if(done)break;acc+=dc.decode(value,{stream:true});
      if(!raf)raf=requestAnimationFrame(()=>{raf=0;const n=near();show(out,acc,true);if(n)log.scrollTop=log.scrollHeight})}
    cancelAnimationFrame(raf);show(out,acc,false);simChips(out.parentNode,text+' '+acc);
    chat.push({role:'user',content:text},{role:'assistant',content:acc});save();
  }catch(e){out.classList.remove('cur');out.textContent=e.message||'No pude responder. Intenta de nuevo.'}
  busy=false;
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('q').value;$('q').value='';$('q').style.height='';ask(v)};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}};
$('q').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'};
$('new').onclick=()=>{if(busy)return;chat=[];save();render();$('side').classList.remove('open')};
$('dl').onclick=()=>{const t=chat.map(m=>(m.role==='user'?'## Pregunta\n':'## '+NAME+'\n')+m.content).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download='apuntes-lenz.md';a.click()};
const rootEl=document.documentElement;
const curTheme=()=>rootEl.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
$('theme').onclick=()=>{const n=curTheme()==='dark'?'light':'dark';rootEl.dataset.theme=n;try{localStorage.setItem('lenz.theme',n)}catch(e){}};
$('menu').onclick=()=>{if(innerWidth>900)document.body.classList.toggle('collapsed');else $('side').classList.toggle('open')};
const ind=$('ind');function moveInd(){const b=document.querySelector('#modes button.on');if(b){ind.style.width=b.offsetWidth+'px';ind.style.transform='translateX('+b.offsetLeft+'px)'}}
$('modes').querySelectorAll('button').forEach(b=>b.addEventListener('click',moveInd));addEventListener('resize',moveInd);document.fonts&&document.fonts.ready.then(moveInd);moveInd();
log.addEventListener('scroll',()=>$('down').classList.toggle('show',!near()&&chat.length>0));
$('down').onclick=()=>log.scrollTo({top:log.scrollHeight,behavior:'smooth'});
const SIMS=[
{s:'charges-and-fields',n:'Cargas y campos',d:'Mueve cargas y mide campo y potencial.',g:0,t:[0,1],k:'carga,campo electrico,potencial electrico,equipotencial,linea de campo'},
{s:'coulombs-law',n:'Ley de Coulomb',d:'Fuerza entre dos cargas según la distancia.',g:0,t:[0],k:'coulomb,fuerza electrica,ley de coulomb'},
{s:'capacitor-lab-basics',n:'Condensadores',d:'Área, separación y capacitancia.',g:0,t:[2],k:'condensador,capacitor,capacitancia,dielectrico'},
{s:'ohms-law',n:'Ley de Ohm',d:'Voltaje, resistencia y corriente.',g:1,t:[3],k:'ley de ohm,ohm,resistencia,corriente electrica'},
{s:'resistance-in-a-wire',n:'Resistencia de un alambre',d:'Resistividad, longitud y área.',g:1,t:[3],k:'resistividad,resistencia de un alambre,conductor'},
{s:'circuit-construction-kit-dc',n:'Circuitos en serie y paralelo',d:'Arma circuitos y mide con instrumentos.',g:1,t:[4,5],k:'serie,paralelo,circuito,resistencia equivalente,voltimetro,amperimetro'},
{s:'circuit-construction-kit-dc-virtual-lab',n:'Laboratorio de circuitos',d:'Kirchhoff con instrumentos realistas.',g:1,t:[5],k:'kirchhoff,nodo,malla'},
{s:'circuit-construction-kit-ac',n:'Circuitos RC, RLC y AC',d:'Condensadores, bobinas y fuente alterna.',g:3,t:[6,10,11],k:'circuito rc,rlc,carga y descarga,constante de tiempo,corriente alterna,bobina,inductor,reactancia,resonancia'},
{s:'magnet-and-compass',n:'Imán y brújula',d:'El campo de un imán de barra.',g:2,t:[7],k:'iman,brujula,campo magnetico'},
{s:'magnets-and-electromagnets',n:'Imanes y electroimanes',d:'Corriente, espiras y campo.',g:2,t:[7,8],k:'electroiman,solenoide,biot,ampere,espira,campo de un conductor'},
{s:'faradays-law',n:'Ley de Faraday',d:'Mueve un imán e induce corriente.',g:2,t:[9],k:'faraday,lenz,induccion,flujo magnetico,fem inducida'},
{s:'generator',n:'Generador',d:'Del movimiento a la corriente alterna.',g:2,t:[9,10],k:'generador,alternador,fem'}];
let curSim=null,lang='es';
const PLAY='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
function setFrame(){const x=curSim;$('sfr').src='https://phet.colorado.edu/sims/html/'+x.s+'/latest/'+x.s+'_'+lang+'.html';$('so').href='https://phet.colorado.edu/'+lang+'/simulations/'+x.s;$('sl').textContent=lang.toUpperCase()}
let autoCol=false;function openSim(x){curSim=x;$('sn').textContent=x.n;setFrame();if(innerWidth>900&&!document.body.classList.contains('collapsed')){document.body.classList.add('collapsed');autoCol=true}document.body.classList.add('simopen')}
$('sl').onclick=()=>{lang=lang==='es'?'en':'es';setFrame()};
$('sx').onclick=()=>{document.body.classList.remove('simopen');if(autoCol){document.body.classList.remove('collapsed');autoCol=false}$('sfr').src='about:blank'};
function setView(v){document.body.dataset.view=v;$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('sa').onclick=()=>{setView('chat');$('q').value='Estoy usando la simulación «'+curSim.n+'». Guíame con un experimento paso a paso para entender el tema.';$('q').focus();if(innerWidth<=900)$('sx').click()};
function buildLab(){const L=$('lab');L.innerHTML='<div class="lw"><h2>Laboratorio</h2><p>Simulaciones interactivas de PhET. Corren en tu navegador y no consumen tu saldo.</p></div>';const w=L.firstChild;
  GROUPS.forEach(([g,c],gi)=>{const it=SIMS.filter(x=>x.g===gi);if(!it.length)return;const h=document.createElement('h3');h.textContent=g;h.style.setProperty('--c',c);const gr=document.createElement('div');gr.className='lg';
    it.forEach(x=>{const b=document.createElement('button');b.className='lc';b.style.setProperty('--c',c);b.innerHTML='<span class="th"><img alt="" loading="lazy" src="https://phet.colorado.edu/sims/html/'+x.s+'/latest/'+x.s+'-600.png" onerror="this.remove()"></span><b>'+x.n+'</b><small>'+x.d+'</small>';b.onclick=()=>openSim(x);gr.appendChild(b)});w.append(h,gr)});
  const n=document.createElement('p');n.className='nt';n.textContent='Electrónica (diodos y rectificadores): PhET no tiene una simulación de diodos en HTML5, así que ese tema se trabaja con el tutor.';w.appendChild(n)}
buildLab();
function simsFor(text){const n=nrm(text);return SIMS.map(x=>({x,s:(topic&&x.t.some(i=>TOPICS[i]===topic)?3:0)+x.k.split(',').filter(k=>n.includes(nrm(k))).length*2})).filter(o=>o.s>=2).sort((a,b)=>b.s-a.s).slice(0,2).map(o=>o.x)}
function simChips(w,text){if(!w||!w.classList||!w.classList.contains('mw'))return;const l=simsFor(text);if(!l.length)return;const r=document.createElement('div');r.className='scs';l.forEach(x=>{const b=document.createElement('button');b.innerHTML=PLAY+'Abrir simulación: '+x.n;b.onclick=()=>openSim(x);r.appendChild(b)});w.appendChild(r)}
document.querySelectorAll('.t').forEach(b=>b.addEventListener('click',()=>{const l=SIMS.filter(x=>x.t.some(i=>TOPICS[i]===topic));$('simbtn').hidden=!l.length;$('simbtn').dataset.s=l.length?SIMS.indexOf(l[0]):''}));
$('simbtn').onclick=()=>{const i=$('simbtn').dataset.s;if(i!=='')openSim(SIMS[+i])};
const FL='<svg class="fl" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h4M9 3v5l-4 7a1.5 1.5 0 0 0 1.3 2.2h7.4A1.5 1.5 0 0 0 15 15l-4-7V3"/></svg>';
document.querySelectorAll('.tc').forEach(b=>{if(SIMS.some(x=>x.t.some(i=>TOPICS[i]===b.dataset.t)))b.insertAdjacentHTML('beforeend',FL)});
$('rp').onclick=()=>{setView('chat');document.querySelector('#modes [data-m="practicar"]').click();$('q').focus()};
render();
</script>
